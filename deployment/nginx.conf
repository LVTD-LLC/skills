server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /catalog.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|png|svg|ico|json)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
