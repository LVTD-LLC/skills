name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Choose release version
        id: version
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git checkout main
          git reset --hard origin/main

          current_version="$(node -p "require('./package.json').version")"

          while git rev-parse -q --verify "refs/tags/v${current_version}" >/dev/null; do
            npm version patch --no-git-tag-version
            current_version="$(node -p "require('./package.json').version")"
          done

          echo "version=${current_version}" >> "$GITHUB_OUTPUT"

      - name: Build generated artifacts
        run: npm run build

      - name: Validate generated artifacts
        run: npm run validate:marketplaces

      - name: Commit release artifacts
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin .agents plugins

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${version}"
          fi

          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"

      - name: Package catalog
        run: |
          tar -czf dist/lvtd-skills.tar.gz skills README.md docs package.json
          tar -czf dist/lvtd-marketplace.tar.gz .claude-plugin .agents plugins skills

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skills-catalog
          path: dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/registry.json
            dist/lvtd-skills.tar.gz
            dist/lvtd-marketplace.tar.gz
