name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check catalog
        run: npm run check

      - name: Package catalog
        run: |
          tar -czf dist/lvtd-skills.tar.gz skills README.md docs package.json
          tar -czf dist/lvtd-marketplace.tar.gz .claude-plugin .agents plugins skills

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/registry.json
            dist/lvtd-skills.tar.gz
            dist/lvtd-marketplace.tar.gz
