name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate skills
        run: npm test

      - name: Build registry
        run: npm run build

      - name: Package catalog
        run: |
          tar -czf dist/lvtd-skills.tar.gz skills README.md docs package.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: skills-catalog
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/registry.json
            dist/lvtd-skills.tar.gz
