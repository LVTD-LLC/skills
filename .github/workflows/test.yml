name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate skills
        run: npm test

      - name: Build registry
        run: npm run build

      - name: Validate marketplace artifacts
        run: npm run validate:marketplaces
