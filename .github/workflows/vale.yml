name: Vale

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vale:
    name: Prose lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Vale
        uses: vale-cli/vale-action@v2.1.1
        with:
          version: 3.15.1
          files: '["README.md","AGENTS.md","CHANGELOG.md","CONTEXT.md","SECURITY.md","docs","skills"]'
          filter_mode: added
          # Keep advisory until the project vocabulary and blocking rules settle.
          fail_on_error: false
